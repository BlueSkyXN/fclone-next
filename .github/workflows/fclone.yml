---
name: fclone

on:
  push:
    branches:
      - master
    tags:
      - "fclone-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fclone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Go ${{ matrix.go }} test
    # FUSE integration tests require a runner image that permits mounts.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.25.x"
          - "1.26.5"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Configure FUSE and NFS clients
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 nfs-common
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          sudo chown root:"$USER" /etc/fuse.conf

      - name: Install test binary
        run: |
          go install -tags noselfupdate .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test non-FUSE packages
        env:
          RCLONE_CONFIG: /notfound
        run: |
          packages=()
          while IFS= read -r package; do
            case "$package" in
              */cmd/mount | */cmd/mount2) ;;
              *) packages+=("$package") ;;
            esac
          done < <(go list ./...)
          go test -tags noselfupdate "${packages[@]}"

      - name: Test FUSE packages with mount privileges
        env:
          RCLONE_CONFIG: /notfound
        run: |
          go test -tags noselfupdate -c -o "$RUNNER_TEMP/mount.test" ./cmd/mount
          go test -tags noselfupdate -c -o "$RUNNER_TEMP/mount2.test" ./cmd/mount2
          sudo env "PATH=$PATH" "RCLONE_CONFIG=$RCLONE_CONFIG" \
            "$RUNNER_TEMP/mount.test" -test.v
          sudo env "PATH=$PATH" "RCLONE_CONFIG=$RCLONE_CONFIG" \
            "$RUNNER_TEMP/mount2.test" -test.v

      - name: Vet all packages
        if: matrix.go == '1.26.5'
        run: go vet ./...

      - name: Race-test compatibility packages
        if: matrix.go == '1.26.5'
        env:
          RCLONE_CONFIG: /notfound
        run: go test -race ./backend/drive ./fs/cache ./fs/sync ./fs/accounting

      - name: Build and inspect fclone
        if: matrix.go == '1.26.5'
        run: |
          make fclone FCLONE_VERSION=v0.1.1-ci
          core_version="$(sed -n 's/^var VersionTag = "\([^"]*\)"/\1/p' fs/versiontag.go)-DEV"
          ./fclone version
          ./fclone version | grep -F 'fclone v0.1.1-ci'
          ./fclone version | grep -F -- "- rclone ${core_version}"
          ./fclone version --check >version-check.txt 2>&1
          grep -F 'official rclone releases are disabled' version-check.txt

      - name: Verify default build cannot self-update
        if: matrix.go == '1.26.5'
        run: |
          go build -o fclone-default .
          ./fclone-default version | grep -F 'fclone v0.1.1-dev'
          if ./fclone-default selfupdate >selfupdate.txt 2>&1; then
            echo 'selfupdate unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'unknown command "selfupdate"' selfupdate.txt

  quality:
    name: Code quality and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true

      - name: Verify release metadata isolation
        run: |
          make -s vars CURRENT_TAGS=fclone-v9.9.9 >fclone-vars.txt 2>fclone-vars.err
          if [[ -s fclone-vars.err ]]; then
            cat fclone-vars.err >&2
            exit 1
          fi
          if grep -F "TAG='fclone-v9.9.9'" fclone-vars.txt; then
            echo 'fclone tag unexpectedly changed rclone release metadata' >&2
            exit 1
          fi

          git tag v999.998.0 HEAD^
          git tag v999.999.0 HEAD
          make -s vars \
            "CURRENT_TAGS=fclone-v9.9.9 v999.999.0" \
            VERSION=v999.999.0 \
            >rclone-vars.txt 2>rclone-vars.err
          if [[ -s rclone-vars.err ]]; then
            cat rclone-vars.err >&2
            exit 1
          fi
          grep -Fx "TAG='v999.999.0'" rclone-vars.txt
          grep -Fx "LAST_TAG='v999.998.0'" rclone-vars.txt

      - name: Verify module files
        run: |
          go mod verify
          go mod tidy -diff

      - name: Lint fork workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint .github/workflows/fclone.yml .github/workflows/winget.yml

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          skip-cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan for vulnerabilities
        run: govulncheck ./...

  native_windows:
    name: Native Windows compile
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true

      - name: Compile all packages
        env:
          RCLONE_CONFIG: "C:\\notfound"
        run: go test -tags noselfupdate -run '^$' ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - test
      - quality
      - native_windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            smoke: true
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true

      - name: Set fclone version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^fclone-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
              echo "invalid fclone release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#fclone-}"
          else
            version="v0.1.1-dev.${GITHUB_SHA:0:8}"
          fi
          echo "FCLONE_BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, package, and inspect
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          package="fclone-${FCLONE_BUILD_VERSION#v}-${GOOS}-${GOARCH}"
          stage="build/${package}"
          mkdir -p "$stage" dist
          binary="${stage}/fclone"
          if [[ "$GOOS" == "windows" ]]; then binary="${binary}.exe"; fi
          make fclone FCLONE_VERSION="$FCLONE_BUILD_VERSION" FCLONE_BINARY="$binary"
          cp COPYING NOTICE README.md "$stage/"

          if [[ "${{ matrix.smoke }}" == "true" ]]; then
            core_version="$(sed -n 's/^var VersionTag = "\([^"]*\)"/\1/p' fs/versiontag.go)-DEV"
            "$binary" version | grep -F "fclone ${FCLONE_BUILD_VERSION}"
            "$binary" version | grep -F -- "- rclone ${core_version}"
            if "$binary" selfupdate > release-selfupdate.txt 2>&1; then
              echo 'release binary selfupdate unexpectedly succeeded' >&2
              exit 1
            fi
            grep -F 'unknown command "selfupdate"' release-selfupdate.txt
          fi

          if [[ "$GOOS" == "windows" ]]; then
            (cd build && zip -qr "../dist/${package}.zip" "$package")
            archive="dist/${package}.zip"
            unzip -Z1 "$archive" > archive-contents.txt
          else
            tar -C build -czf "dist/${package}.tar.gz" "$package"
            archive="dist/${package}.tar.gz"
            tar -tzf "$archive" > archive-contents.txt
          fi

          grep -Fx "${package}/COPYING" archive-contents.txt
          grep -Fx "${package}/NOTICE" archive-contents.txt
          grep -Fx "${package}/README.md" archive-contents.txt
          if [[ "$GOOS" == "windows" ]]; then
            grep -Fx "${package}/fclone.exe" archive-contents.txt
          else
            grep -Fx "${package}/fclone" archive-contents.txt
          fi
          archive_name="$(basename "$archive")"
          (cd dist && sha256sum "$archive_name" > "${archive_name}.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fclone-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  gate:
    name: fclone CI
    if: always()
    needs:
      - test
      - quality
      - native_windows
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_WINDOWS_RESULT: ${{ needs.native_windows.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" || \
                "$QUALITY_RESULT" != "success" || \
                "$NATIVE_WINDOWS_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" ]]; then
            echo "required jobs: test=$TEST_RESULT quality=$QUALITY_RESULT native_windows=$NATIVE_WINDOWS_RESULT build=$BUILD_RESULT" >&2
            exit 1
          fi

  release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/fclone-v') && needs.gate.result == 'success'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fclone-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and create combined manifest
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^fclone-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "invalid fclone release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch origin master
          tag_commit="$(git rev-list -n1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$tag_commit" origin/master
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
          (cd dist && sha256sum fclone-*.tar.gz fclone-*.zip > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#fclone-}"
          notes_file="docs/release-notes-${version}.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "fclone ${version}" \
            "${notes_args[@]}" \
            dist/fclone-*.tar.gz \
            dist/fclone-*.zip \
            dist/fclone-*.sha256 \
            dist/SHA256SUMS
